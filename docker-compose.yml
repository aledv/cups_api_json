services:
  cups-api:
    build: .
    container_name: cups-api
    restart: unless-stopped
    # Host network so the container reaches CUPS on localhost:631.
    # Change the listening port with PORT (ports: mappings are ignored in host mode).
    network_mode: host
    environment:
      PORT: "5001"
      # CUPS_SERVER: "localhost:631"   # or a socket path, e.g. /run/cups/cups.sock
    volumes:
      # Only needed if CUPS listens on its Unix socket
      - /run/cups/cups.sock:/run/cups/cups.sock:ro
